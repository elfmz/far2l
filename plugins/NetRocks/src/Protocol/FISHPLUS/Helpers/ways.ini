; Ways to reach a shell that the FISH+ helper will then be uploaded into.
;
; Same format and same machinery as SHELL/ways.ini - see that file for the
; general idea. The difference is what runs on the far side: SHELL sends its
; helper as a sequence of shell commands, FISH+ sends a bootstrap line that
; reads the helper in through the shell's own read builtin. So all a way has
; to do here is to get us to a plain POSIX shell and tell us when it is there.
;
; The greeting is what the LOGIN section waits for. It is deliberately the
; same string the SHELL protocol uses, because it is matched against, never
; parsed, and reusing it keeps the two files diffable against each other.
;
; "exec sh" rather than plain "sh": a csh or fish login shell would otherwise
; sit between us and the helper, and neither of them can run it.

[SSH]
Command="ssh $OPT0 -p "$PORT" "$USER@$HOST" "$OPT1""
OPT0_Name="Compression"
OPT0_Items="{No:}|Yes:-C"
OPT1_Name="Login with sudo"
OPT1_Items="{No:echo 'far2l is ready for fishing'; HISTCONTROL=ignorespace exec sh}|Yes:sudo -S sh -c 'echo far2l is ready for fishing; HISTCONTROL=ignorespace exec sh'"

[SSH/LOGIN]
"far2l is ready for fishing\n"=^
"*password: "="$PASSWORD\n"
"*Enter passphrase for key*"="$PASSWORD\n"
"*password for user: "="$PASSWORD\r\n"
"Are you sure*"="yes\n"
"Host key verification failed"=^STDERR
"Permission denied*\n"=^AUTH
"Sorry, try again.*\n"=^AUTH

; ssh to a Windows peer, ending up at an interactive PowerShell. The pwsh
; bootstrap does not fit a POSIX shell (it is PowerShell syntax), so the
; helper picks helper.ps1 rather than helper.sh - the Flavor option in the
; site settings, or the auto-probe, decides which one is uploaded.
;
; The whole outer chain (greeting + nested interactive PowerShell) is
; passed via -EncodedCommand: PowerShell accepts a UTF-16LE base64 script
; as one bare token, which sidesteps every quoting layer between here and
; the remote shell (far2l's ExplodeCommandLine splits on unquoted &/|,
; ssh joins its argv[N..] with spaces, sshd wraps in DefaultShell's own
; parser). The encoded blob below decodes to:
;
;     Write-Output 'far2l is ready for fishing'; powershell -NoLogo -NoProfile
;
; The trailing PowerShell is interactive: it inherits stdin from the ssh
; pipe and consumes the FISH+ bootstrap. Works whether the peer's
; DefaultShell is cmd.exe or powershell.exe - the outer shell only has to
; find powershell.exe on PATH.

[SSH_PWSH]
Command="ssh $OPT0 -p "$PORT" "$USER@$HOST" powershell -NoLogo -NoProfile -EncodedCommand VwByAGkAdABlAC0ATwB1AHQAcAB1AHQAIAAnAGYAYQByADIAbAAgAGkAcwAgAHIAZQBhAGQAeQAgAGYAbwByACAAZgBpAHMAaABpAG4AZwAnADsAIABwAG8AdwBlAHIAcwBoAGUAbABsACAALQBOAG8ATABvAGcAbwAgAC0ATgBvAFAAcgBvAGYAaQBsAGUA"
OPT0_Name="Compression"
OPT0_Items="{No:}|Yes:-C"

[SSH_PWSH/LOGIN]
"far2l is ready for fishing\n"=^
"*password: "="$PASSWORD\n"
"*Enter passphrase for key*"="$PASSWORD\n"
"*password for user: "="$PASSWORD\r\n"
"Are you sure*"="yes\n"
"Host key verification failed"=^STDERR
"Permission denied*\n"=^AUTH
"Sorry, try again.*\n"=^AUTH

[SERIAL]
Serial="$HOST"
OPT0_Name="Baudrate"
OPT0_Items="50|150|300|600|1200|2400|4800|9600|19200|38400|57600|{115200}|230400|460800|500000|576000|921600|1000000|1152000|1500000|2000000|2500000|3000000|3500000|4000000"
OPT1_Name="Flow control"
OPT1_Items="{None}|Xon/Xoff|RTS/CTS"
OPT2_Name="Data bits"
OPT2_Items="5|6|7|{8}"
OPT3_Name="Stop bits"
OPT3_Items="{1}|2"
OPT4_Name="Parity"
OPT4_Items="{None}|Odd|Even"

[SERIAL/LOGIN]
""="\n [ -n "$SAVED_STTY" ] || SAVED_STTY=`stty -g`; stty raw -echo; ( echo 'echo; echo; echo; echo; echo far2l is ready for fishing'; cat ) | sh | cat; stty $SAVED_STTY\necho\n"
"far2l is ready for fishing\n"=^
